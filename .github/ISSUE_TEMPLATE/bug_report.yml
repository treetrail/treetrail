name: Bug report
description: A query selects the wrong nodes, fails, or behaves unexpectedly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version and module
      placeholder: jsonpath-core 0.2.0, jsonpath-jackson2 0.2.0
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: JSON model
      options:
        - Plain Java objects (JavaObjectModel)
        - Jackson 2
        - Jackson 3
        - Gson
        - Jakarta JSON-P
        - Own JsonModel
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Expression and document
      description: The JSONPath expression and a document, as small as possible.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: The nodes or paths you expected, and why (RFC 9535 section, another implementation).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The nodes, paths or exception with stack trace.
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: Temurin 21.0.8
