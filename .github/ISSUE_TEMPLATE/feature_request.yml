name: Feature request
description: A new feature, module or API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, for example the API you would like to call.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other libraries solve it.
