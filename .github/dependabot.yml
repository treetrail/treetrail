version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      # The version catalog pins Jayway JsonPath 2.x (jayway2) on purpose: jsonpath-migration is tested
      # against both major versions. Major updates of json-path are therefore made by hand.
      - dependency-name: "com.jayway.jsonpath:json-path"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      # Own reusable workflows (christoph-sens/ci-workflows) need no waiting period.
      exclude: ["christoph-sens/*"]
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
