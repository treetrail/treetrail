name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared CI, see https://github.com/christoph-sens/ci-workflows
  # `build` runs the JSONPath Compliance Test Suite; a single failing case fails the build.
  ci:
    uses: christoph-sens/ci-workflows/.github/workflows/gradle-ci.yml@ce3875a12a2736e3ece801f6fe56f5b8b71c533d # v1.3.4
    permissions:
      contents: write        # dependency submission on push to main
      security-events: write # CodeQL results
    with:
      # `fuzz` fuzzes every fuzz target for 15 seconds; .github/workflows/fuzz.yml fuzzes longer every night.
      gradle-tasks: build publishToMavenLocal fuzz
