name: Fuzz

# Fuzzes every fuzz target of jsonpath-core and openapi-overlay for longer than the short run in CI. The
# generated corpus is cached between runs, so each night starts where the last one stopped. Findings are
# uploaded as an artifact: put a crash file into <module>/src/test/resources/<package>/<FuzzTest>Inputs/<target>/
# (for example jsonpath-core/src/test/resources/io/github/treetrail/jsonpath/JsonPathFuzzTestInputs/) to replay
# it in every build.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzzing time per target, e.g. 10m or 1h
        default: 10m

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            jsonpath-core/build/fuzz/*/.cifuzz-corpus
            openapi-overlay/build/fuzz/*/.cifuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        run: ./gradlew :jsonpath-core:fuzz :openapi-overlay:fuzz --continue "-PfuzzDuration=$DURATION"
        env:
          DURATION: ${{ inputs.duration || '10m' }}
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            jsonpath-core/build/fuzz/*/crash-*
            jsonpath-core/build/fuzz/*/timeout-*
            jsonpath-core/build/reports/tests/fuzz*/
            openapi-overlay/build/fuzz/*/crash-*
            openapi-overlay/build/fuzz/*/timeout-*
            openapi-overlay/build/reports/tests/fuzz*/
          if-no-files-found: ignore
