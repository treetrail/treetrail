name: Mutation testing

# Runs PIT on jsonpath-core every night: too slow for every build, but it shows where tests would not notice
# a changed condition or return value. Fails if the mutation score drops below the threshold in
# jsonpath-core/build.gradle.kts. The HTML report is uploaded as an artifact.

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Mutation testing
        run: ./gradlew :jsonpath-core:pitest
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-report
          path: jsonpath-core/build/reports/pitest/
          if-no-files-found: ignore
