name: Mutation testing

# Runs PIT on jsonpath-core every night: too slow for every build, but it shows where tests would not notice
# a changed condition or return value. Fails if the mutation score drops below the threshold in
# jsonpath-core/build.gradle.kts. The HTML report is uploaded as an artifact.

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Mutation testing
        run: ./gradlew :jsonpath-core:pitest
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report
          path: jsonpath-core/build/reports/pitest/
          if-no-files-found: ignore
