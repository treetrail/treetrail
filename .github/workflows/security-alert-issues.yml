name: Security alert issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Shared job, see https://github.com/christoph-sens/ci-workflows
  sync:
    uses: christoph-sens/ci-workflows/.github/workflows/security-alert-issues.yml@60c595c00ed7d6f7e31488b7d00a0492ea25c982 # v1.3.7
    permissions:
      issues: write
    secrets:
      alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
