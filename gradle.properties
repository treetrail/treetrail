# Reuse task outputs across builds and branches, build modules in parallel, and keep the configuration between
# runs. The build is reproducible, so cached outputs equal fresh ones.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# The daemon compiles build-logic's Kotlin; the default 512 MB heap makes it thrash, for example in CodeQL's traced build.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# API compatibility (docs/releasing.md#api-compatibility): the release the public API of each published module is
# compared with, and the published modules that are not in that release yet. Update both after each release.
treetrail.apiBaselineVersion=0.2.0
treetrail.unreleasedModules=jsonpath-model-testkit,jsonpath-jayway-functions
