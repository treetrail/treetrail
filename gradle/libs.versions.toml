[versions]
jazzer = "0.30.0"
jqwik = "1.10.1"
junit = "6.1.3"
assertj = "3.27.7"
jackson2 = "2.22.3"
jackson3 = "3.2.3"
gson = "2.14.0"
# Two versions of the same artifact: Dependabot cannot tell them apart and sets both to the same
# version. jsonpath-migration's build fails if jayway is not 3.x or jayway2 not 2.x; fix such updates by hand.
jayway = "3.0.0"
# The latest 2.x release, still widely used; jsonpath-migration is also tested against it.
jayway2 = "2.10.0"
jmh = "1.37"
# Other RFC 9535 implementations for Java, compared in jsonpath-benchmarks only.
sjf4j = "1.3.3"
ajp = "0.0.7"
spring = "7.0.9"
jakarta-servlet = "6.1.0"
jakarta-json = "2.1.3"
parsson = "1.1.9"
rewrite-bom = "8.90.4"
micrometer = "1.17.1"
maven-publish = "0.37.0"
cyclonedx = "3.4.1"
japicmp = "0.26.3"
# JaCoCo, applied through Gradle's jacoco plugin (toolVersion); not a library, so Dependabot does not update it.
jacoco = "0.8.15"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"
jspecify = "1.0.1"
spotless = "8.10.3"
# The formatter Spotless runs; not a library, so Dependabot does not update it.
palantir-java-format = "2.101.0"
# Mutation testing: PIT and its JUnit Platform plugin.
pitest = "1.30.0"
pitest-junit5 = "1.2.3"

[libraries]
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jayway-jsonpath = { module = "com.jayway.jsonpath:json-path", version.ref = "jayway" }
jayway2-jsonpath = { module = "com.jayway.jsonpath:json-path", version.ref = "jayway2" }
spring-bom = { module = "org.springframework:spring-framework-bom", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-webflux = { module = "org.springframework:spring-webflux" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
sjf4j = { module = "org.sjf4j:sjf4j", version.ref = "sjf4j" }
ajp = { module = "org.xmljacquard:ajp", version.ref = "ajp" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json" }
parsson = { module = "org.eclipse.parsson:parsson", version.ref = "parsson" }
rewrite-bom = { module = "org.openrewrite:rewrite-bom", version.ref = "rewrite-bom" }
rewrite-java = { module = "org.openrewrite:rewrite-java" }
rewrite-java-jdk25 = { module = "org.openrewrite:rewrite-java-25" }
rewrite-test = { module = "org.openrewrite:rewrite-test" }
# Not in the rewrite BOM, but released with the same version.
rewrite-kotlin = { module = "org.openrewrite:rewrite-kotlin", version.ref = "rewrite-bom" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
