[versions]
junit = "6.1.3"
assertj = "3.27.7"
jackson2 = "2.22.3"
jackson3 = "3.2.3"
gson = "2.14.0"
# Two versions of the same artifact: Dependabot cannot tell them apart and sets both to the same
# version. jsonpath-migration's build fails if jayway is not 3.x or jayway2 not 2.x; fix such updates by hand.
jayway = "3.0.0"
# The latest 2.x release, still widely used; jsonpath-migration is also tested against it.
jayway2 = "2.10.0"
jmh = "1.37"
spring = "7.0.9"
jakarta-servlet = "6.1.0"
jakarta-json = "2.1.3"
parsson = "1.1.9"
rewrite-bom = "8.90.4"
micrometer = "1.17.1"
maven-publish = "0.37.0"
cyclonedx = "3.4.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jayway-jsonpath = { module = "com.jayway.jsonpath:json-path", version.ref = "jayway" }
jayway2-jsonpath = { module = "com.jayway.jsonpath:json-path", version.ref = "jayway2" }
spring-bom = { module = "org.springframework:spring-framework-bom", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-webflux = { module = "org.springframework:spring-webflux" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json" }
parsson = { module = "org.eclipse.parsson:parsson", version.ref = "parsson" }
rewrite-bom = { module = "org.openrewrite:rewrite-bom", version.ref = "rewrite-bom" }
rewrite-java = { module = "org.openrewrite:rewrite-java" }
rewrite-java-jdk25 = { module = "org.openrewrite:rewrite-java-25" }
rewrite-test = { module = "org.openrewrite:rewrite-test" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
